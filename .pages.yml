# Pages CMS — https://pagescms.org
#
# Interface d'édition en ligne (utilisable depuis un téléphone) pour ce dépôt.
# Rien à héberger : Pages CMS est une app hébergée à laquelle on donne accès au
# dépôt via l'app GitHub. Elle commite directement sur la branche choisie, et
# `.github/workflows/deploy.yml` reconstruit puis publie le site.
#
# Deux régimes volontairement différents :
#
#   - `docs` ne déclare aucun champ. Pages CMS bascule alors en « éditeur de
#     fichier » : le markdown est ouvert brut, frontmatter compris, et réécrit
#     octet pour octet. C'est ce qu'on veut ici, parce que la plupart des pages
#     de `docs/` n'ont pas de frontmatter du tout et que les blocs ```typr ne
#     doivent jamais être reformatés par un éditeur.
#
#   - `blog` déclare des champs, parce que le frontmatter des billets est
#     régulier (title / slug / authors / tags / image). Le corps reste une zone
#     de texte markdown brut, pour la même raison.
#
# Rappel avant de committer sur `main` : `onBrokenLinks` vaut `throw` dans
# `docusaurus.config.ts`. Un lien interne cassé fait échouer le build et bloque
# le déploiement. Depuis un téléphone, préférer une branche + PR : la CI
# construit les PR sans les publier.

settings:
  content:
    # Conserve les clés de frontmatter qui ne sont pas déclarées ci-dessous au
    # lieu de les effacer à l'enregistrement.
    merge: true

media:
  input: static/img
  output: /img
  categories: [image]

content:
  - name: docs
    label: Documentation
    description: Pages de docs/. Markdown brut, frontmatter compris.
    type: collection
    path: docs
    subfolders: true
    # Le nom de fichier est saisi à la création (mode éditeur de fichier) ;
    # ce gabarit ne sert que de valeur initiale.
    filename: '{primary}.md'
    format: code
    view:
      layout: tree

  - name: blog
    label: Blog
    type: collection
    path: blog
    subfolders: false
    filename:
      template: '{year}-{month}-{day}-{primary}.md'
      field: create
    format: yaml-frontmatter
    view:
      # `date` n'est pas un champ du frontmatter : Pages CMS le déduit du nom de
      # fichier, à condition qu'il soit listé ici.
      fields: [title, date, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titre
        type: string
        required: true
      - name: slug
        label: Slug
        description: Fin de l'URL du billet. Sans slug, Docusaurus le déduit du nom de fichier.
        type: string
      - name: authors
        label: Auteurs
        description: Clés définies dans blog/authors.yml.
        type: select
        options:
          multiple: true
          values: [fabrice, slorber, yangshun]
      - name: tags
        label: Tags
        description: Clés définies dans blog/tags.yml. Pour en ajouter une, éditer « Blog — tags ».
        type: select
        options:
          multiple: true
          values:
            - typr
            - oop
            - tdd
            - javascript
            - vectorization
            - array
            - docusaurus
      - name: image
        label: Image de couverture
        type: image
      - name: body
        label: Contenu
        type: text

  # Un seul billet est en .mdx, et une collection ne liste qu'une extension.
  - name: blog-mdx
    label: Blog (MDX)
    description: Billets .mdx, édités en markdown brut (ils contiennent du JSX).
    type: collection
    path: blog
    subfolders: false
    filename: '{year}-{month}-{day}-{primary}.mdx'
    format: code
    operations:
      create: false

  - name: blog-tags
    label: Blog — tags
    description: Liste des tags autorisés. Y ajouter une entrée avant de l'utiliser dans un billet.
    type: file
    path: blog/tags.yml
    format: code

  - name: blog-authors
    label: Blog — auteurs
    type: file
    path: blog/authors.yml
    format: code
