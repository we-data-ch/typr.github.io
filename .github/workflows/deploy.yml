name: Deploy documentation

# Trois déclencheurs :
#   - un push sur main (édition de la doc) ;
#   - un repository_dispatch émis par la release du compilateur, pour que la
#     doc soit reconstruite quand une nouvelle version de TypR sort ;
#   - manuellement.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [typr-release]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Fetch TypR version from develop
        run: |
          VERSION=$(curl -sf https://raw.githubusercontent.com/we-data-ch/typr/develop/Cargo.toml \
            | grep '^version = ' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "TYPR_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Sync version in homepage
        run: |
          sed -i "s/version [0-9]*\.[0-9]*\.[0-9]*/version $TYPR_VERSION/" src/pages/index.tsx

# La grammaire est un fichier *généré* par le compilateur et recopié ici
      # par sa release ; l'éditer à la main ferait revivre la divergence que le
      # manifeste a supprimée. On ne bloque pas le build pour autant : entre deux
      # releases, la copie a le droit d'être en retard sur `develop`.
      - name: Grammaire TypR — vérifier qu'elle n'a pas été éditée à la main
        run: |
          UPSTREAM=$(mktemp)
          if ! curl -sfL -o "$UPSTREAM" \
            https://raw.githubusercontent.com/we-data-ch/typr/develop/editors/vscode/syntaxes/typr.tmLanguage.json; then
            echo "::warning title=Grammaire non vérifiée::impossible de récupérer la grammaire de référence."
            exit 0
          fi
          if diff -q "$UPSTREAM" syntaxes/typr.tmLanguage.json > /dev/null; then
            echo "syntaxes/typr.tmLanguage.json est identique à la grammaire générée."
          else
            echo "::warning title=Grammaire décalée::syntaxes/typr.tmLanguage.json diffère de we-data-ch/typr@develop. Si ce n'est pas juste un retard entre deux releases, c'est une édition à la main : elle sera écrasée à la prochaine release. La source est crates/typr-core/src/components/syntax/mod.rs."
            diff "$UPSTREAM" syntaxes/typr.tmLanguage.json | head -40 || true
          fi
      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Sur une PR on s'arrête ici : le build a validé les liens et le MDX,
      # mais rien n'est publié tant que ce n'est pas fusionné.
      - name: Deploy to gh-pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: >-
            Deploy ${{ github.event_name == 'repository_dispatch'
              && format('for TypR {0}', github.event.client_payload.version)
              || github.sha }}
